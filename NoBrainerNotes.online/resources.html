<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources — NoBrainer IGCSE Database</title>
    <meta name="description" content="Browse the NoBrainer IGCSE subject database — Physics, English B, Maths B, Further Pure Maths, ICT, and Computer Science.">
    <link rel="icon" type="image/png" href="NoBrainerLogo.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        pro: {
                            bg: '#050505',
                            card: '#0a0a0a',
                            border: '#1f1f1f',
                            text: '#ededed',
                            muted: '#888888'
                        }
                    },
                    animation: {
                        'aurora-1': 'aurora1 22s ease-in-out infinite alternate',
                        'aurora-2': 'aurora2 28s ease-in-out infinite alternate',
                        'fade-in': 'fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        aurora1: {
                            '0%': { transform: 'translate(0%, 0%) scale(1) rotate(0deg)', opacity: '0.6' },
                            '50%': { opacity: '1' },
                            '100%': { transform: 'translate(12%, -12%) scale(1.25) rotate(18deg)', opacity: '0.6' }
                        },
                        aurora2: {
                            '0%': { transform: 'translate(0%, 0%) scale(1) rotate(0deg)', opacity: '0.6' },
                            '50%': { opacity: '1' },
                            '100%': { transform: 'translate(-12%, 12%) scale(1.15) rotate(-18deg)', opacity: '0.6' }
                        },
                        fadeIn: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- Shared Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-pro-bg text-pro-text font-sans min-h-screen flex flex-col selection:bg-white/20 overflow-x-hidden relative">

    <!-- Ambient Owls -->
    <svg class="ambient-owl owl-1 w-36 h-36 text-blue-200" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M47.5 25C42.5 30 25 32 10 40C22.5 38 35 44 42.5 50L47.5 58L52.5 58L57.5 50C65 44 77.5 38 90 40C75 32 57.5 30 52.5 25C51.5 24 48.5 24 47.5 25Z" fill="currentColor"/>
    </svg>
    <svg class="ambient-owl owl-2 w-52 h-52 text-indigo-200" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M47.5 25C42.5 30 25 32 10 40C22.5 38 35 44 42.5 50L47.5 58L52.5 58L57.5 50C65 44 77.5 38 90 40C75 32 57.5 30 52.5 25C51.5 24 48.5 24 47.5 25Z" fill="currentColor"/>
    </svg>
    <svg class="ambient-owl owl-3 w-24 h-24 text-white" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M47.5 25C42.5 30 25 32 10 40C22.5 38 35 44 42.5 50L47.5 58L52.5 58L57.5 50C65 44 77.5 38 90 40C75 32 57.5 30 52.5 25C51.5 24 48.5 24 47.5 25Z" fill="currentColor"/>
    </svg>

    <!-- ============================================================
         MAIN CONTENT
    ============================================================ -->
    <main id="top" class="relative z-10 max-w-6xl mx-auto px-6 pt-16 pb-24 flex-1 w-full">

        <!-- Page Header -->
        <div class="mb-10 reveal is-visible">
            <div class="flex items-center gap-3 mb-4">
                <span class="section-label">// Resources</span>
                <div class="h-px flex-1 bg-gradient-to-r from-white/10 to-transparent"></div>
            </div>
            <h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-gradient leading-tight mb-4">IGCSE Subject Database</h1>
            <p class="text-pro-muted text-[15px] max-w-2xl leading-relaxed">
                Browse the full NoBrainer archive. Each subject is organized as a folder with notes, mark schemes, and past papers. Select a subject to explore its contents.
            </p>
        </div>

        <!-- Finder Window -->
        <div class="glass-window rounded-xl w-full max-w-5xl mx-auto flex flex-col h-[600px] reveal is-visible">

            <!-- Mac Window Titlebar -->
            <div class="h-12 border-b border-white/5 bg-white/[0.02] flex items-center px-4 justify-between select-none shrink-0">
                <div class="flex items-center gap-2 w-1/3">
                    <div class="w-3 h-3 rounded-full bg-[#FF5F56] border border-black/20"></div>
                    <div class="w-3 h-3 rounded-full bg-[#FFBD2E] border border-black/20"></div>
                    <div class="w-3 h-3 rounded-full bg-[#27C93F] border border-black/20"></div>
                </div>
                <div class="w-1/3 text-center text-xs font-medium text-pro-muted flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-blue-400" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
                    <span id="window-title">NoBrainer_IGCSE</span>
                </div>
                <div class="w-1/3 flex justify-end"></div>
            </div>

            <!-- Window Body -->
            <div class="flex flex-1 overflow-hidden">

                <!-- Sidebar (desktop) -->
                <aside class="w-56 border-r border-white/5 bg-black/20 p-3 hidden sm:flex flex-col gap-6 select-none shrink-0 overflow-y-auto">
                    <div>
                        <div class="text-[10px] font-bold text-pro-muted uppercase tracking-wider mb-2 px-2">Favorites</div>
                        <div id="sidebar-favorites" class="flex flex-col gap-0.5"></div>
                    </div>
                    <div>
                        <div class="text-[10px] font-bold text-pro-muted uppercase tracking-wider mb-2 px-2">Subjects</div>
                        <div id="sidebar-subjects" class="flex flex-col gap-0.5"></div>
                    </div>
                </aside>

                <!-- Main File Area -->
                <div class="flex-1 bg-transparent p-6 overflow-y-auto relative z-10 flex flex-col">

                    <!-- Mobile subject chips -->
                    <div id="mobile-chips" class="sm:hidden flex gap-2 overflow-x-auto no-scrollbar pb-3 mb-3 -mx-1 px-1"></div>

                    <!-- Breadcrumbs -->
                    <div id="breadcrumbs" class="flex items-center gap-2 text-xs text-pro-muted font-medium mb-6 flex-wrap"></div>

                    <!-- Grid View -->
                    <div id="file-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-4 content-start"></div>

                    <!-- Empty state -->
                    <div id="empty-state" class="hidden flex-1 flex-col items-center justify-center text-center py-16">
                        <svg class="w-12 h-12 text-pro-muted/40 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                        <p class="text-sm text-pro-muted">Select a subject folder to browse its contents</p>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Shared Components (header, footer, search overlay injected) -->
    <script src="components.js"></script>
    <script src="app.js"></script>

    <!-- Resources Page Script -->
    <script>
        /* ==========================================================
           RESOURCES PAGE — Finder-style subject browser
        ========================================================== */
        let activeSubject = null;

        function folderIcon(cls) {
            return '<svg class="w-14 h-14 ' + cls + ' group-hover:scale-105 transition-transform duration-200 drop-shadow-md" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>';
        }
        function pdfIcon() {
            return '<div class="relative w-12 h-14 bg-white rounded flex items-center justify-center shadow-md group-hover:scale-105 transition-transform duration-200"><div class="absolute top-0 right-0 w-3 h-3 bg-gray-200 rounded-bl"></div><span class="text-[10px] font-bold text-red-600 bg-red-100 px-1 rounded">PDF</span></div>';
        }

        function renderSidebar() {
            const favs = document.getElementById('sidebar-favorites');
            const subs = document.getElementById('sidebar-subjects');
            const chips = document.getElementById('mobile-chips');
            favs.innerHTML = '';
            subs.innerHTML = '';
            chips.innerHTML = '';

            // Favorites: All Subjects (root)
            const allItem = document.createElement('div');
            allItem.className = 'text-sm flex items-center gap-2 px-2 py-1.5 rounded-md cursor-pointer transition-colors ' +
                (activeSubject === null
                    ? 'bg-blue-500/10 text-blue-400 font-medium'
                    : 'text-pro-muted hover:text-gray-300');
            allItem.innerHTML = '<svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg><span>All Subjects</span>';
            allItem.addEventListener('click', function () { selectSubject(null); });
            favs.appendChild(allItem);

            // Subjects
            SUBJECTS.forEach(function (s) {
                const item = document.createElement('div');
                item.className = 'text-sm flex items-center gap-2 px-2 py-1.5 rounded-md cursor-pointer transition-colors ' +
                    (activeSubject === s.id
                        ? 'bg-blue-500/10 text-blue-400 font-medium'
                        : 'text-pro-muted hover:text-gray-300');
                item.innerHTML = '<svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg><span class="truncate">' + s.name + ' (' + s.code + ')</span>';
                item.addEventListener('click', function () { selectSubject(s.id); });
                subs.appendChild(item);

                // Mobile chip
                const chip = document.createElement('button');
                chip.className = 'shrink-0 px-3 py-1.5 rounded-full text-xs font-medium border transition-colors ' +
                    (activeSubject === s.id
                        ? 'bg-blue-500/10 text-blue-400 border-blue-500/30'
                        : 'bg-white/[0.03] text-pro-muted border-white/10 hover:text-white');
                chip.textContent = s.name;
                chip.addEventListener('click', function () { selectSubject(s.id); });
                chips.appendChild(chip);
            });
        }

        function renderFiles() {
            const grid = document.getElementById('file-grid');
            const empty = document.getElementById('empty-state');
            const crumbs = document.getElementById('breadcrumbs');
            const title = document.getElementById('window-title');

            grid.innerHTML = '';
            crumbs.innerHTML = '';

            if (!activeSubject) {
                // Show all subjects as folders
                empty.classList.add('hidden');
                grid.classList.remove('hidden');
                title.textContent = 'NoBrainer_IGCSE';
                crumbs.innerHTML = '<span class="text-white">NoBrainer_IGCSE</span>';

                SUBJECTS.forEach(function (s) {
                    const tile = document.createElement('div');
                    tile.className = 'file-tile flex flex-col items-center gap-2 p-3 rounded-lg cursor-pointer group';
                    tile.innerHTML = folderIcon(s.accent) + '<span class="text-xs text-gray-200 text-center font-medium line-clamp-1">' + s.folder + '</span>';
                    tile.addEventListener('click', function () { selectSubject(s.id); });
                    grid.appendChild(tile);
                });
                return;
            }

            empty.classList.add('hidden');
            grid.classList.remove('hidden');

            const subj = SUBJECTS.find(function (s) { return s.id === activeSubject; });
            if (!subj) return;

            title.textContent = subj.folder;
            crumbs.innerHTML =
                '<span class="hover:text-white cursor-pointer transition-colors" onclick="selectSubject(null)">NoBrainer_IGCSE</span>' +
                '<span>/</span>' +
                '<span class="text-white">' + subj.folder + '</span>';

            subj.files.forEach(function (file) {
                const tile = document.createElement('div');
                tile.className = 'file-tile flex flex-col items-center gap-2 p-3 rounded-lg cursor-pointer group';
                if (file.type === 'folder') {
                    tile.innerHTML = folderIcon(file.color || 'text-blue-400') + '<span class="text-xs text-gray-200 text-center font-medium line-clamp-1">' + file.name + '</span>';
                } else {
                    tile.innerHTML = pdfIcon() + '<span class="text-xs text-gray-200 text-center font-medium line-clamp-2 leading-tight mt-1">' + file.name + '</span>';
                }
                // If folder has a link, open it in a new tab
                if (file.link) {
                    tile.classList.add('hover:bg-white/[0.04]');
                    tile.addEventListener('click', function () {
                        window.open(file.link, '_blank', 'noopener');
                    });
                }
                grid.appendChild(tile);
            });
        }

        function selectSubject(id) {
            activeSubject = id;
            renderSidebar();
            renderFiles();
        }

        /* Handle ?subject= query param */
        function handleQueryParam() {
            const params = new URLSearchParams(window.location.search);
            const subjId = params.get('subject');
            if (subjId) {
                const found = SUBJECTS.find(function (s) { return s.id === subjId; });
                if (found) selectSubject(found.id);
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            renderSidebar();
            renderFiles();
            handleQueryParam();
        });
    </script>
</body>
</html>
